openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Data Engineering Knowledge Hub API
  version: 0.1.0
  description: |
    Contrato de la API del MVP (ADR-002). Solo lectura sobre el conocimiento; lectura y escritura sobre el estado personal (/me).
    Los datos se derivan de content/ (ADR-000). Los conceptos vienen del Knowledge Blueprint (ADR-003) y `has_page` indica si ya tienen ficha.
    Las relaciones combinan las aristas de las entidades (origin: entity) y los related_* del blueprint (origin: blueprint, tipo RELATED_TO).
    PART_OF (ADR-024): outgoing es la ficha padre (a lo sumo una); incoming (label has_part) son las fichas hijas, en el orden del blueprint.
    Mocks de cada respuesta en docs/contracts/mock-data/ (index.json).
servers:
  - url: http://localhost:8000/api/v1
    description: Backend local (A-F2.3)

tags:
  - name: knowledge
  - name: search
  - name: me

paths:
  /domains:
    get:
      tags: [knowledge]
      operationId: listDomains
      summary: Dominios del blueprint con conteos.
      responses:
        "200":
          description: Los dominios, ordenados por id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainList" }

  /domains/{slug}:
    get:
      tags: [knowledge]
      operationId: getDomain
      summary: Dominio con sus subdominios y conceptos.
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: Dominio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /concepts:
    get:
      tags: [knowledge]
      operationId: listConcepts
      summary: Conceptos, patrones y arquitecturas del blueprint.
      parameters:
        - { name: domain, in: query, schema: { $ref: "#/components/schemas/Slug" } }
        - { name: subdomain, in: query, schema: { $ref: "#/components/schemas/Slug" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/Kind" } }
        - { name: classification, in: query, schema: { $ref: "#/components/schemas/Classification" } }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/Level" } }
        - { name: mvp, in: query, schema: { type: boolean } }
        - { name: has_page, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de conceptos, ordenados por dominio, subdominio y posición en el blueprint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConceptList" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /concepts/{slug}:
    get:
      tags: [knowledge]
      operationId: getConcept
      summary: Concepto con metadata §40 y, si tiene ficha, sus secciones.
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: Concepto.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConceptDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /technologies:
    get:
      tags: [knowledge]
      operationId: listTechnologies
      summary: Inventario de tecnologías y servicios cloud.
      parameters:
        - { name: type, in: query, schema: { $ref: "#/components/schemas/TechnologyType" } }
        - { name: origin, in: query, schema: { $ref: "#/components/schemas/Origin" } }
        - { name: category, in: query, schema: { type: string } }
        - { name: classification, in: query, schema: { $ref: "#/components/schemas/Classification" } }
        - { name: mvp, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de tecnologías, ordenadas por slug.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechnologyList" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /technologies/{slug}:
    get:
      tags: [knowledge]
      operationId: getTechnology
      summary: Tecnología con metadata §40, fuentes y comparación en la Cloud Capability Matrix.
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: Tecnología.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechnologyDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /snippets:
    get:
      tags: [knowledge]
      operationId: listSnippets
      summary: Code Library (§23, ADR-008). Snippets ordenados por slug.
      parameters:
        - { name: language, in: query, schema: { $ref: "#/components/schemas/Language" } }
        - { name: cloud, in: query, schema: { $ref: "#/components/schemas/Cloud" } }
        - { name: implements, in: query, description: Slug del concept o pattern que implementa., schema: { $ref: "#/components/schemas/Slug" } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de snippets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnippetList" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /snippets/{slug}:
    get:
      tags: [knowledge]
      operationId: getSnippet
      summary: Snippet con su código, explicación del patrón, requisitos y fuentes (ADR-008).
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: Snippet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnippetDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /entities/{slug}/relations:
    get:
      tags: [knowledge]
      operationId: getRelations
      summary: Relaciones de cualquier entidad o concepto, agrupadas por tipo y dirección.
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: Grupos de relaciones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationGroups" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /sources/{slug}:
    get:
      tags: [knowledge]
      operationId: getSource
      summary: Fuente del Source Registry.
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: Fuente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /search:
    get:
      tags: [search]
      operationId: search
      summary: Búsqueda de texto con resultados agrupados por tipo (§35).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/ResultType" } }
        - { name: domain, in: query, schema: { $ref: "#/components/schemas/Slug" } }
        - { name: classification, in: query, schema: { $ref: "#/components/schemas/Classification" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Resultados agrupados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/study-state:
    get:
      tags: [me]
      operationId: listStudyStates
      summary: Estados de estudio registrados, del más reciente al más antiguo (Home §38).
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/StudyStatus" } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de estados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyStateList" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/study-state/{slug}:
    get:
      tags: [me]
      operationId: getStudyState
      summary: Estado de estudio de un concepto o tecnología. Sin registro previo devuelve `not_reviewed`.
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: Estado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyState" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [me]
      operationId: putStudyState
      summary: Crea o reemplaza el estado de estudio (idempotente).
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyStateUpdate" }
      responses:
        "200":
          description: Estado guardado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyState" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/notes/{slug}:
    get:
      tags: [me]
      operationId: listNotes
      summary: Notas personales de un concepto o tecnología, de la más reciente a la más antigua.
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: Notas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteList" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [me]
      operationId: createNote
      summary: Agrega una nota personal en Markdown.
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteCreate" }
      responses:
        "201":
          description: Nota creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/notes/{slug}/{note_id}:
    put:
      tags: [me]
      operationId: updateNote
      summary: Reemplaza el texto de una nota personal (ADR-006).
      parameters: [{ $ref: "#/components/parameters/Slug" }, { $ref: "#/components/parameters/NoteId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteUpdate" }
      responses:
        "200":
          description: Nota actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [me]
      operationId: deleteNote
      summary: Borra una nota personal (ADR-006).
      parameters: [{ $ref: "#/components/parameters/Slug" }, { $ref: "#/components/parameters/NoteId" }]
      responses:
        "204":
          description: Nota borrada.
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/favorites:
    get:
      tags: [me]
      operationId: listFavorites
      summary: Favoritos, del más reciente al más antiguo.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de favoritos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteList" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/favorites/{slug}:
    get:
      tags: [me]
      operationId: getFavorite
      summary: Si un concepto o tecnología está marcado como favorito.
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: Favorito.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorite" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [me]
      operationId: putFavorite
      summary: Marca o desmarca como favorito (idempotente).
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteUpdate" }
      responses:
        "200":
          description: Favorito guardado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorite" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Slug" }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    NoteId:
      name: note_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9-]+$" }

  responses:
    NotFound:
      description: No existe un recurso con ese slug.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Parámetros o cuerpo inválidos.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # --- Vocabularios (deben coincidir con schemas/enums.schema.json; lo verifica tests/test_contract.py) ---
    Slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 100 }
    Date: { type: string, format: date }
    DateTime: { type: string, format: date-time }
    Classification: { enum: [core, modern, emerging] }
    Level: { enum: [basic, intermediate, advanced] }
    Importance: { enum: [high, medium, low] }
    VerificationStatus: { enum: [verified, review_required, potentially_outdated, deprecated, archived] }
    Cloud: { enum: [gcp, aws, azure, agnostic] }
    Kind: { description: Tipo de ficha que tendrá el concepto (ADR-003)., enum: [concept, pattern, architecture] }
    TechnologyType: { enum: [technology, cloud_service] }
    Origin: { description: Proveedor (cloud_service) o vendor (technology)., enum: [gcp, aws, azure, open-source, other] }
    SourceType: { enum: [official_docs, release_notes, engineering_blog, spec_paper, secondary, legislative] }  # legislative: ADR-023
    Jurisdiction: { enum: [CL, EU, BR], description: "País cuya ley origina el contenido, ISO 3166-1 alfa-2; EU es el código reservado para la Unión Europea (ADR-023, Enmienda 5)." }
    LegalBasis:
      description: Artículo en que se apoya una ficha con jurisdicción (ADR-023); url es la cita oficial.
      type: object
      required: [law, article, url, note, implication]
      properties:
        law: { enum: [ley-19628, ley-21719, ley-21663, eu-2016-679, br-lei-13709] }
        article: { type: string, description: "Como lo numera el texto oficial, p. ej. 14 quinquies." }
        url: { type: string, format: uri }
        note: { type: [string, "null"] }
        implication: { type: string, description: "Implicancia técnica del artículo para la plataforma de datos (enmienda de ADR-023)." }
      additionalProperties: false
    RelationType:
      enum: [USES, IMPLEMENTS, DEPENDS_ON, ALTERNATIVE_TO, RELATED_TO, REPLACES, EXTENDS, RUNS_ON, PRODUCES, CONSUMES, PRACTICES, AFFECTS, UPDATES, REQUIRES, PART_OF]  # PART_OF: ADR-024
    EntityType:
      enum: [concept, pattern, architecture, technology, cloud_service, code_snippet, lab, news, release, source, job_description, interview_question, personal_note]
    ResultType: { enum: [concept, pattern, architecture, technology, cloud_service, code_snippet, source] }
    Language: { description: Lenguaje de un snippet (code_snippet.schema.json)., enum: [sql, python, terraform, yaml, bash, json, other] }
    StudyStatus:
      description: Estados manuales de §37.
      enum: [not_reviewed, reviewing, understood, applied, needs_review]

    Problem:
      description: Error en formato RFC 9457.
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    Page:
      type: object
      required: [total, limit, offset]
      properties:
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }

    # --- Dominios ---
    DomainSummary:
      type: object
      required: [id, slug, title, description, band, concept_count, mvp_count]
      properties:
        id: { type: string, pattern: "^\\d{2}$" }
        slug: { $ref: "#/components/schemas/Slug" }
        title: { type: string }
        description: { type: string }
        band:
          description: "ADR-027: banda fuera de las 6 capas de la UI; null si el dominio está en una capa."
          enum: [especializacion, null]
        concept_count: { type: integer, minimum: 0 }
        mvp_count: { type: integer, minimum: 0 }
    DomainList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { allOf: [{ $ref: "#/components/schemas/DomainSummary" }], unevaluatedProperties: false }
      additionalProperties: false
    DomainDetail:
      allOf: [{ $ref: "#/components/schemas/DomainSummary" }]
      type: object
      required: [legal_framework, subdomains, availability_texts]
      properties:
        availability_texts: { $ref: "#/components/schemas/AvailabilityTexts" }
        legal_framework:
          description: "ADR-027: marco legal verificado del dominio; null si no tiene."
          oneOf: [{ $ref: "#/components/schemas/LegalFramework" }, { type: "null" }]
        subdomains:
          type: array
          items:
            type: object
            required: [slug, title, concepts]
            properties:
              slug: { $ref: "#/components/schemas/Slug" }
              title: { type: string }
              concepts: { type: array, items: { $ref: "#/components/schemas/ConceptSummary" } }
            additionalProperties: false
      unevaluatedProperties: false

    LegalFramework:
      description: "ADR-027: cada hecho con su URL de Nivel 1 (BCN o Senado/Cámara) y la fecha en que se verificó."
      type: object
      required: [slug, title, jurisdiction, facts]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        title: { type: string }
        jurisdiction: { type: string }
        facts:
          type: array
          items:
            type: object
            required: [key, label, value, url, source, verified_at]
            properties:
              key: { type: string }
              label: { type: string }
              value: { type: string }
              url: { type: string, format: uri }
              checked_with: { type: string, format: uri }
              source: { type: string }
              verified_at: { type: string, format: date }
              note: { type: string }
            additionalProperties: false
      additionalProperties: false

    # --- Conceptos ---
    ConceptSummary:
      type: object
      required: [slug, title, kind, domain, subdomain, classification, level, importance, mvp, has_page, verification_status, last_verified, availability]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        title: { type: string }
        kind: { $ref: "#/components/schemas/Kind" }
        domain: { $ref: "#/components/schemas/Slug" }
        subdomain: { $ref: "#/components/schemas/Slug" }
        classification: { $ref: "#/components/schemas/Classification" }
        level: { $ref: "#/components/schemas/Level" }
        importance: { $ref: "#/components/schemas/Importance" }
        mvp: { type: boolean }
        has_page: { type: boolean, description: true si existe la ficha en content/. }
        verification_status:
          description: Estado de la ficha; null si aún no tiene ficha.
          oneOf: [{ $ref: "#/components/schemas/VerificationStatus" }, { type: "null" }]
        last_verified: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        availability: { $ref: "#/components/schemas/Availability" }
      additionalProperties: false
    Availability:
      description: "ADR-031: available, o una ficha que se publica como página mínima (in_review: contenido listo, en revisión; in_development: contenido y diseño en preparación)."
      enum: [available, in_review, in_development]
    AvailabilityText:
      description: "ADR-031: textos de content/ui/availability.yaml para un estado no disponible."
      type: object
      required: [label, help, back_label]
      properties:
        label: { type: string, description: Etiqueta (tag) del estado. }
        help: { type: string, description: Texto de ayuda de la página mínima. }
        back_label: { type: string, description: Texto del enlace de vuelta al itinerario. }
      additionalProperties: false
    AvailabilityTexts:
      description: "ADR-031, enmienda 1: content/ui/availability.yaml completo, para las etiquetas y los conteos por tramo del itinerario. {n} y {total} los reemplaza la UI."
      type: object
      required: [in_review, in_development, available, route_count, back_label]
      properties:
        in_review: { $ref: "#/components/schemas/AvailabilityState" }
        in_development: { $ref: "#/components/schemas/AvailabilityState" }
        available:
          type: object
          required: [count]
          properties: { count: { type: string, description: "«{n} disponibles»." } }
          additionalProperties: false
        route_count: { type: string, description: "«{n} de {total} fichas disponibles»." }
        back_label: { type: string }
      additionalProperties: false
    AvailabilityState:
      type: object
      required: [label, help, count]
      properties:
        label: { type: string }
        help: { type: string }
        count: { type: string, description: "Conteo de un tramo, p. ej. «{n} en revisión»." }
      additionalProperties: false
    UnavailableLink:
      description: "ADR-031: ficha enlazada desde esta (cuerpo, vistas, relaciones o temas relacionados) que no está disponible; el componente la muestra con su etiqueta y sin navegar."
      type: object
      required: [slug, title, target_availability, label]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        title: { type: string }
        target_availability: { enum: [in_review, in_development] }
        label: { type: string, description: Etiqueta del estado (AvailabilityText.label). }
      additionalProperties: false
    ConceptList:
      allOf: [{ $ref: "#/components/schemas/Page" }]
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ConceptSummary" } }
      unevaluatedProperties: false

    Metadata:
      description: Metadata mínima §40. Los campos que aún no tienen valor (concepto sin ficha) son null o lista vacía.
      type: object
      required: [id, title, slug, description, type, domain, subdomain, classification, level, cloud, technologies, tags, related_topics, sources, created_at, updated_at, last_verified, verification_status]
      properties:
        id: { type: string }
        title: { type: string }
        slug: { $ref: "#/components/schemas/Slug" }
        description: { type: [string, "null"] }
        type: { $ref: "#/components/schemas/EntityType" }
        domain: { oneOf: [{ $ref: "#/components/schemas/Slug" }, { type: "null" }] }
        subdomain: { oneOf: [{ $ref: "#/components/schemas/Slug" }, { type: "null" }] }
        classification: { oneOf: [{ $ref: "#/components/schemas/Classification" }, { type: "null" }] }
        level: { oneOf: [{ $ref: "#/components/schemas/Level" }, { type: "null" }] }
