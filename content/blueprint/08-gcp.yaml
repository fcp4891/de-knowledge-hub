# Knowledge Blueprint v1 · Dominio 08 (plan maestro §10)
# Conceptos específicos de producto, con prefijo, enlazados al concepto genérico (ADR-003).
# Detalles de producto (límites, precios, comportamiento) se verifican al redactar la ficha.
domain:
  id: "08"
  slug: gcp
  title: Google Cloud Platform
  description: Cómo se implementan los conceptos de Data Engineering con los servicios prioritarios de GCP.

