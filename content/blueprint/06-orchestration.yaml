# Knowledge Blueprint v1 · Dominio 06 (plan maestro §8)
# Dependencias, retries y backfill viven en 05-pipelines y se enlazan. Fuera de los dominios MVP: máx. ~5 mvp con mvp_reason.
domain:
  id: "06"
  slug: orchestration
  title: Orquestación
  description: Conceptos de orquestación independientes de proveedor y diferencia entre proyectos open source y servicios administrados.

subdomains:
  - slug: orchestration-concepts
    title: Conceptos de orquestación
    concepts:
      - slug: dag
        title: DAG
        kind: concept
        classification: core
        level: basic
        importance: high
        mvp: true
        mvp_reason: Airflow/Composer (§51); unidad básica del snippet "DAG de Airflow" de A-F3.2.
        related_technologies: [apache-airflow, gcp-cloud-composer]
        related_concepts: [data-orchestration, pipeline-dependencies]
      - slug: orchestration-task
        title: Task
        kind: concept
        classification: core
        level: basic
        importance: high
        mvp: false
        related_concepts: [dag, retries, idempotency]
      - slug: scheduler
        title: Scheduler
        kind: concept
        classification: core
        level: basic
        importance: high
        mvp: true
        mvp_reason: Airflow/Composer (§51); entender cuándo y cómo se ejecutan los DAG.
        related_technologies: [apache-airflow]
        related_concepts: [dag]
      - slug: sensors
        title: Sensors
        kind: concept
        classification: core
        level: intermediate
        importance: medium
        mvp: false
        related_technologies: [apache-airflow]
        related_concepts: [event-driven-orchestration]
      - slug: catchup
        title: Catchup
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: true
        mvp_reason: Airflow/Composer (§51); relación entre scheduling, backfill e idempotencia.
        related_technologies: [apache-airflow]
        related_concepts: [backfill, scheduler, idempotency]
      - slug: dynamic-workflows
        title: Workflows dinámicos
        kind: concept
        classification: modern
        level: advanced
        importance: medium
        mvp: false
        related_technologies: [apache-airflow]
        related_concepts: [dag]
      - slug: event-driven-orchestration
        title: Orquestación event-driven
        kind: concept
        classification: modern
        level: intermediate
        importance: medium
        mvp: false
        related_concepts: [event-driven-pipelines]
      - slug: orchestration-observability
        title: Observabilidad de la orquestación
        kind: concept
        classification: core
        level: intermediate
        importance: medium
        mvp: false
        related_concepts: [dag]

  - slug: orchestration-tools
    title: Herramientas y servicios
    concepts:
      - slug: airflow-architecture
        title: Arquitectura de Apache Airflow
        kind: concept
        classification: modern
        level: intermediate
        importance: high
        mvp: true
        mvp_reason: Airflow/Composer (§51); componentes que Composer administra.
        related_technologies: [apache-airflow]
        related_concepts: [scheduler, dag]
      - slug: airflow-operators-and-hooks
        title: Operators y hooks de Airflow
        kind: concept
        classification: modern
        level: intermediate
        importance: medium
        mvp: false
        related_technologies: [apache-airflow]
        related_concepts: [orchestration-task]
      - slug: open-source-vs-managed-orchestration
        title: Orquestador open source vs servicio administrado
        kind: concept
        classification: modern
        level: intermediate
        importance: high
        mvp: true
        mvp_reason: Airflow/Composer (§51); el plan exige diferenciar el proyecto open source del servicio que lo ejecuta.
        related_technologies: [apache-airflow, gcp-cloud-composer, aws-mwaa]
        related_concepts: [airflow-architecture]
      - slug: orchestration-landscape
        title: Panorama de orquestadores
        kind: concept
        classification: modern
        level: intermediate
        importance: medium
        mvp: false
        related_technologies: [azure-data-factory, microsoft-fabric, aws-step-functions, dagster, prefect]
        related_concepts: [open-source-vs-managed-orchestration]
        note: Dagster y Prefect como tecnologías a seguir (§8); no reemplazan a Airflow.
