# Knowledge Blueprint v1 · Dominio 07 (plan maestro §9)
# Arquitecturas de referencia del Architecture Lab. Cambio de MVP en el gate F1: entra event-driven,
# sale medallion (sigue en la lista de F4 del ROADMAP; ver STATUS, decisiones pendientes).
domain:
  id: "07"
  slug: architecture
  title: Arquitecturas de datos
  description: Arquitecturas de referencia con problema, componentes, trade-offs e implementación por cloud.

subdomains:
  - slug: reference-architectures
    title: Arquitecturas analíticas de referencia
    concepts:
      - slug: batch-pipeline-architecture
        title: Arquitectura de pipeline batch
        kind: architecture
        classification: core
        level: intermediate
        importance: high
        mvp: true
        added_by: blueprint
        related_technologies: [gcp-cloud-storage, gcp-bigquery, gcp-cloud-composer]
        related_concepts: [batch-ingestion, incremental-load, backfill, pipeline-layers]
        note: No figura en §9 pero es una de las 5 arquitecturas de F4 (ROADMAP).
      - slug: streaming-pipeline-architecture
        title: Arquitectura de pipeline streaming
        kind: architecture
        classification: core
        level: intermediate
        importance: high
        mvp: true
        added_by: blueprint
        related_technologies: [gcp-pubsub, gcp-dataflow, gcp-bigquery]
        related_concepts: [streaming-ingestion, dead-letter-queue, watermarks, checkpoints]
        note: No figura en §9 pero es una de las 5 arquitecturas de F4 (ROADMAP).
      - slug: modern-data-warehouse-architecture
        title: Modern Data Warehouse
        kind: architecture
        classification: modern
        level: intermediate
        importance: high
        mvp: false
        related_technologies: [gcp-bigquery, aws-redshift, microsoft-fabric]
        related_concepts: [data-warehouse, etl-vs-elt, bigquery-architecture]
      - slug: data-lake-architecture
        title: Arquitectura Data Lake
        kind: architecture
        classification: core
        level: intermediate
        importance: medium
        mvp: false
        related_technologies: [gcp-cloud-storage, aws-s3, azure-adls]
        related_concepts: [data-lake]
      - slug: lakehouse-architecture
        title: Arquitectura Lakehouse
        kind: architecture
        classification: modern
        level: advanced
        importance: high
        mvp: false
        related_technologies: [apache-iceberg, delta-lake, gcp-biglake]
        related_concepts: [lakehouse, data-lake-architecture, open-table-formats]
      - slug: medallion-architecture
        title: Medallion Architecture
        kind: architecture
        classification: modern
        level: intermediate
        importance: high
        mvp: false
        related_concepts: [pipeline-layers, lakehouse]
        note: Bronze/silver/gold es una convención de capas, no un estándar formal. Fuera del MVP (gate F1) por solaparse con pipeline-layers y lakehouse. Sigue en las 5 arquitecturas de F4 aunque no sea MVP del blueprint.

  - slug: streaming-architectures
    title: Arquitecturas streaming y event-driven
    concepts:
      - slug: lambda-architecture
        title: Lambda Architecture
        kind: architecture
        classification: modern
        level: advanced
        importance: medium
        mvp: false
        related_concepts: [batch-vs-streaming, kappa-architecture]
        note: Se estudia para reconocer el doble camino batch más speed; no es el diseño por defecto.
      - slug: kappa-architecture
        title: Kappa Architecture
        kind: architecture
        classification: modern
        level: advanced
        importance: medium
        mvp: false
        related_technologies: [apache-kafka]
        related_concepts: [replay, lambda-architecture, streaming-pipeline-architecture]
      - slug: event-driven-architecture
        title: Event-driven architecture
        kind: architecture
        classification: modern
        level: intermediate
        importance: high
        mvp: true
        related_technologies: [gcp-pubsub, apache-kafka]
        related_concepts: [event-driven-pipelines, streaming-pipeline-architecture]
        note: Reaccionar a eventos de negocio no es el pipeline de ingesta continua.
      - slug: real-time-analytics-architecture
        title: Real-time analytics
        kind: architecture
        classification: modern
        level: advanced
        importance: medium
        mvp: false
        related_concepts: [streaming-pipeline-architecture]
        note: Es la consulta de baja latencia, no el pipeline de streaming.

  - slug: integration-architectures
