# Knowledge Blueprint v1 · Dominio 05 (plan maestro §7)
# Idempotencia vive en 01-fundamentals; aquí se enlaza.
domain:
  id: "05"
  slug: pipelines
  title: Pipelines de datos
  description: Patrones completos de ingesta, procesamiento y confiabilidad, de la fuente al consumo (Source → Raw → Curated → Serving).

subdomains:
  - slug: pipeline-stages
    title: Etapas de un pipeline
    concepts:
      - slug: pipeline-layers
        title: Capas raw, curated y serving
        kind: concept
        classification: core
        level: basic
        importance: high
        mvp: false
        related_concepts: [data-pipeline, data-lake, medallion-architecture]

  - slug: ingestion
    title: Ingesta
    concepts:
      - slug: batch-ingestion
        title: Ingesta batch
        kind: concept
        classification: core
        level: basic
        importance: high
        mvp: true
        related_technologies: [gcp-cloud-storage, gcp-bigquery]
        related_concepts: [batch-vs-streaming, data-ingestion]
      - slug: streaming-ingestion
        title: Ingesta streaming
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_technologies: [gcp-pubsub, gcp-dataflow, apache-kafka]
        related_concepts: [batch-vs-streaming, delivery-semantics, event-time-vs-processing-time]
        note: El micro-batch se explica en esta ficha.
      - slug: change-data-capture
        title: Change Data Capture
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_technologies: [debezium, gcp-datastream, aws-dms, apache-kafka]
        related_concepts: [idempotency, scd-type-2, sql-merge, schema-evolution]
      - slug: api-ingestion
        title: Ingesta desde APIs
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_concepts: [retries, incremental-pipelines]
        note: Paginación, rate limit y el contrato HTTP van en esta ficha.
      - slug: file-ingestion
        title: Ingesta de archivos
        kind: concept
        classification: core
        level: basic
        importance: high
        mvp: true
        related_technologies: [gcp-cloud-storage]
        related_concepts: [parquet-format, schema-evolution, csv-format]
      - slug: database-ingestion
        title: Ingesta desde bases de datos
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: false
        related_concepts: [change-data-capture, incremental-load]
        note: La ficha es la decisión full / incremental / CDC, no una cuarta técnica.

  - slug: pipeline-patterns
    title: Patrones de pipeline
    concepts:
      - slug: incremental-pipelines
        title: Pipelines incrementales
        kind: pattern
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_concepts: [incremental-load, idempotency, late-arriving-data, watermarks]
        note: Estado y watermarks a nivel de pipeline; la carga SQL está en incremental-load (02-sql). El full refresh se contrasta en esta ficha.
      - slug: event-driven-pipelines
        title: Pipelines event-driven
        kind: pattern
        classification: modern
        level: intermediate
        importance: high
        mvp: false
        related_technologies: [gcp-pubsub, gcp-cloud-run]
        related_concepts: [streaming-ingestion, event-driven-orchestration, event-driven-architecture]
      - slug: pipeline-dependencies
        title: Dependencias entre procesos
        kind: concept
        classification: core
        level: intermediate
        importance: medium
        mvp: false
        related_concepts: [data-orchestration, dag]
        note: Task y scheduler están en el dominio 06.

  - slug: reliability
    title: Confiabilidad y recuperación
    concepts:
      - slug: retries
        title: Retries
        kind: pattern
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_concepts: [idempotency, exactly-once-semantics]
        note: Backoff exponencial y jitter; solo es seguro con operaciones idempotentes. Un reintento no es entrega exactly-once.
      - slug: checkpoints
        title: Checkpoints
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: false
        related_concepts: [failure-recovery, streaming-ingestion, watermarks]
      - slug: dead-letter-queue
        title: Dead-letter queue
        kind: pattern
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_technologies: [gcp-pubsub]
        related_concepts: [retries]
        note: El mensaje venenoso se trata en esta ficha.
      - slug: replay
        title: Replay
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_concepts: [idempotency, backfill]
        note: Reprocesar eventos ya capturados; distinto de backfill.
      - slug: backfill
        title: Backfill
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_concepts: [idempotency, partitioning]
        note: Completar un rango histórico; catchup (06) es la política del scheduler, no esta ficha.
      - slug: failure-recovery
        title: Recuperación ante fallas
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: false
        related_concepts: [retries, checkpoints, replay, backfill]
