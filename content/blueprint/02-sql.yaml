# Knowledge Blueprint v1 · Dominio 02 (plan maestro §4.2)
# Conceptos SQL genéricos; las particularidades de BigQuery viven en 08-gcp.
domain:
  id: "02"
  slug: sql
  title: SQL avanzado
  description: SQL aplicado al trabajo de datos, con patrones de carga y optimización en warehouses.

subdomains:
  - slug: sql-language
    title: Lenguaje
    concepts:
      - slug: sql-advanced-select
        title: SELECT avanzado
        kind: concept
        classification: core
        level: basic
        importance: medium
        mvp: false
        note: Agregaciones avanzadas (GROUPING SETS, ROLLUP), filtros y orden de evaluación.
      - slug: sql-joins
        title: JOIN
        kind: concept
        classification: core
        level: basic
        importance: high
        mvp: true
      - slug: sql-subqueries
        title: Subqueries
        kind: concept
        classification: core
        level: basic
        importance: medium
        mvp: false
        related_concepts: [sql-cte]
      - slug: sql-cte
        title: CTE (WITH)
        kind: concept
        classification: core
        level: basic
        importance: high
        mvp: true
