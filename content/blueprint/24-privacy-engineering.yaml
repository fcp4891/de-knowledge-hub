        kind: pattern
        classification: core
        level: intermediate
        importance: high
        mvp: false
        added_by: blueprint
        related_concepts: [pseudonymization-vs-anonymization]
        note: Datos personales solo donde se necesitan; bronze, silver con seudónimos y gold agregado. Lote 19a.
      - slug: chilean-identifier-pseudonymization
        title: Seudonimización de identificadores chilenos
        kind: pattern
        classification: core
        level: intermediate
        importance: high
        mvp: false
        added_by: blueprint
        related_concepts: [keyed-hashing, tokenization]
        note: RUT con dígito verificador, HMAC con llave en KMS; incorpora la parte legal de seudonimización y anonimización del upgrade de 19 (2026-10-22).
      - slug: purpose-based-authorization
        title: Autorización por finalidad
        kind: pattern
        classification: core
        level: intermediate
        importance: high
        mvp: false
        added_by: blueprint
        related_concepts: [processing-activities-inventory, data-minimization-by-layer]
        note: Lote P2 (2026-10-28), desde docs/briefs/privacy-program/. Conceder acceso por actividad y finalidad, no por dataset.

