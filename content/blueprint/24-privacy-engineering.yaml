# Knowledge Blueprint v1 · Dominio 24 (ADR-027): ingeniería de privacidad bajo la Ley 21.719.
# Banda «Especialización», fuera de las 6 capas. Explicación técnica, no asesoría legal: rige ADR-023 (jurisdiction,
# legal_basis, etiqueta por afirmación, aviso, y verified solo con owner_approved_at de Felipe). Las 11 fichas vienen
# de 19-compliance (2026-10-28) sin cambios de contenido. Desde el 2026-10-30 (ADR-027, Enmienda 1), 19 se integra
# aquí: su subdominio regulatory-frameworks es el tramo 6, «Marcos regulatorios comparados» (GDPR y LGPD con ficha desde el lote P4, 2026-10-30).
domain:
  id: "24"
  slug: privacy-engineering
  title: Ingeniería de privacidad · Ley 21.719
  description: Cómo se diseña, opera y demuestra una plataforma de datos que trata datos personales bajo la Ley 21.719, desde su impacto técnico y sin constituir asesoría legal.
  band: especializacion
  legal_framework: cl-ley-21719

subdomains:
  - slug: fundamentos
    title: Fundamentos
    concepts:
      - slug: chile-data-protection
        title: Ley 21.719 para ingenieros de datos
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: false
        related_concepts: [pii-identification, processing-activities-inventory]
        note: Ficha padre del subdominio (upgrade de 19, 2026-10-22). Mapa de artículos, vigencia y matriz requisito → control → evidencia; absorbe compliance-scope-for-data-engineers.
      - slug: pii-identification
        title: Identificación de datos personales y sensibles
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: false
        added_by: blueprint
        related_concepts: [data-classification, data-masking]
        note: Dato personal y dato sensible según la ley; detección y clasificación por columna. Lote 19a.
      - slug: processing-activities-inventory
        title: Inventario de actividades de tratamiento
        kind: pattern
        classification: core
        level: intermediate
        importance: high
        mvp: false
        added_by: blueprint
        related_concepts: [data-catalog, data-lineage]
        note: Generado desde el catálogo y el linaje, no una planilla. Lote 19a.

  - slug: diseno-protegido
    title: Diseño protegido
    concepts:
      - slug: data-minimization-by-layer
