# Knowledge Blueprint v1 · Dominio 01 (plan maestro §4.1)
# CDC, backfill y replay tienen su ficha en 05-pipelines (ADR-003: un solo dominio por concepto).
domain:
  id: "01"
  slug: fundamentals
  title: Fundamentos de Data Engineering
  description: Conceptos base, estables e independientes de proveedor, sobre cómo se mueve, almacena y procesa el dato.

subdomains:
