# Knowledge Blueprint v1 · Dominio 21 (plan maestro §20)
# Distinguir capacidad experimental de práctica consolidada (§20): classification lo refleja.
# MCP, agentes de datos y workflows agénticos viven en 23-emerging-technologies (§3.3).
domain:
  id: "21"
  slug: ai-for-data-engineering
  title: IA aplicada a Data Engineering
  description: Fundamentos de LLM, retrieval y sistemas con IA, y sus casos de uso concretos en ingeniería de datos.

subdomains:
  - slug: ai-fundamentals
    title: Fundamentos
    concepts:
      - slug: llm-fundamentals
        title: Fundamentos de LLM
        kind: concept
        classification: modern
        level: basic
        importance: medium
        mvp: false
        related_technologies: [gcp-vertex-ai, aws-bedrock, azure-ai]
      - slug: tokens
        title: Tokens
        kind: concept
        classification: modern
        level: basic
        importance: medium
        mvp: false
        related_concepts: [llm-fundamentals]
      - slug: context-windows
        title: Ventanas de contexto
        kind: concept
        classification: modern
        level: basic
        importance: medium
        mvp: false
        related_concepts: [tokens]
      - slug: embeddings
        title: Embeddings
        kind: concept
        classification: modern
        level: intermediate
        importance: high
        mvp: false
        related_concepts: [llm-fundamentals]
      - slug: structured-outputs
        title: Salidas estructuradas
        kind: concept
        classification: modern
        level: intermediate
        importance: high
        mvp: false
        related_concepts: [data-validation-with-pydantic, schema-validation]
      - slug: tool-calling
        title: Function / tool calling
        kind: concept
        classification: modern
        level: intermediate
        importance: medium
        mvp: false
        related_concepts: [structured-outputs]
        note: Aparece dos veces en §20; una sola ficha.
      - slug: prompt-engineering
        title: Prompt engineering
        kind: concept
        classification: modern
        level: basic
        importance: medium
        mvp: false

