        related_concepts: [embeddings]
      - slug: chunking
        title: Chunking
        kind: concept
        classification: modern
        level: intermediate
        importance: medium
        mvp: false
        related_concepts: [rag]
      - slug: rag
        title: RAG
        kind: concept
        classification: modern
        level: intermediate
        importance: high
        mvp: false
        related_concepts: [embeddings, vector-databases, rag-data-pipeline-architecture]
      - slug: hybrid-rag
