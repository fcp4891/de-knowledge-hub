        related_concepts: [kimball-methodology, dimension-tables]
        note: Base del bus matrix de Kimball; no figura en el listado del plan.

  - slug: alternative-models
    title: Modelos alternativos
    concepts:
      - slug: data-vault
        title: Data Vault
        kind: pattern
        classification: modern
        level: advanced
        importance: medium
        mvp: false
        related_concepts: [kimball-methodology]
      - slug: one-big-table
        title: One Big Table (OBT)
        kind: pattern
        classification: modern
        level: intermediate
        importance: medium
        mvp: false
        related_technologies: [gcp-bigquery]
        related_concepts: [denormalization, star-schema]
      - slug: semantic-models
        title: Modelos semánticos
        kind: concept
        classification: modern
        level: intermediate
        importance: medium
