# Knowledge Blueprint v1 · Dominio 04 (plan maestro §6)
# Medallion, Data Mesh y Data Products tienen su ficha en 07-architecture.
domain:
  id: "04"
  slug: data-modeling
  title: Modelado de datos
  description: Niveles de modelado, normalización, modelado dimensional y modelos alternativos para analítica.

subdomains:
  - slug: modeling-levels
    title: Niveles de modelado
    concepts:
      - slug: conceptual-data-model
        title: Modelo conceptual
        kind: concept
        classification: core
        level: basic
        importance: medium
        mvp: false
      - slug: logical-data-model
        title: Modelo lógico
        kind: concept
        classification: core
        level: basic
        importance: medium
        mvp: false
        related_concepts: [conceptual-data-model]
      - slug: physical-data-model
        title: Modelo físico
        kind: concept
        classification: core
        level: intermediate
        importance: medium
        mvp: false
        related_concepts: [logical-data-model, partitioning, clustering]

  - slug: normalization
    title: Normalización
    concepts:
      - slug: normalization
        title: Normalización
        kind: concept
        classification: core
        level: basic
        importance: high
        mvp: true
        related_concepts: [oltp-vs-olap]
      - slug: denormalization
        title: Desnormalización
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_concepts: [normalization]

  - slug: dimensional-modeling
    title: Modelado dimensional
    concepts:
      - slug: kimball-methodology
        title: Metodología Kimball
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_concepts: [star-schema]
      - slug: star-schema
        title: Star Schema
        kind: pattern
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_concepts: [fact-tables, dimension-tables]
      - slug: snowflake-schema
        title: Snowflake Schema
        kind: pattern
        classification: core
        level: intermediate
        importance: medium
        mvp: false
        related_concepts: [star-schema, normalization]
      - slug: fact-tables
        title: Tablas de hechos
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_concepts: [grain]
      - slug: dimension-tables
        title: Dimensiones
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_concepts: [slowly-changing-dimensions]
      - slug: grain
        title: Grain
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: true
      - slug: surrogate-keys
        title: Surrogate keys
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_concepts: [dimension-tables]
      - slug: slowly-changing-dimensions
        title: Slowly Changing Dimensions (SCD)
        kind: concept
        classification: core
        level: intermediate
        importance: high
        mvp: true
        related_concepts: [scd-type-1, scd-type-2]
      - slug: conformed-dimensions
        title: Dimensiones conformadas
        kind: concept
        classification: core
        level: intermediate
        importance: medium
        mvp: false
