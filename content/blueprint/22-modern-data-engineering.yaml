# Knowledge Blueprint v1 · Dominio 22 (plan maestro §3.2)
# La mayoría de los temas "modern" del §3.2 ya tienen ficha en su dominio (lakehouse, data-contracts,
# data-observability, open-table-formats, ci-cd-for-data, gitops, medallion-architecture); aquí se enlazan.
# Los conceptos propios de este dominio no figuran en el plan: todos llevan added_by (revisión B-F1.2 aplicada en el gate F1).
domain:
  id: "22"
  slug: modern-data-engineering
  title: Modern Data Engineering
  description: Prácticas y enfoques ampliamente adoptados hoy, que complementan y no reemplazan los fundamentos.

subdomains:
  - slug: modern-practices
    title: Prácticas modernas
    concepts:
      - slug: modern-data-stack
        title: Modern data stack
        kind: concept
        classification: modern
        level: basic
        importance: low
        mvp: false
        added_by: blueprint
        related_concepts: [lakehouse, data-contracts, data-observability, open-table-formats, ci-cd-for-data, gitops, medallion-architecture]
        note: Etiqueta histórica con adopción en declive; se conserva como mapa de entrada y por su presencia en ofertas.
      - slug: analytics-engineering
        title: Analytics engineering
        kind: concept
        classification: modern
        level: intermediate
        importance: high
        mvp: false
        added_by: blueprint
        related_technologies: [dbt, gcp-dataform]
        related_concepts: [dbt-core-concepts, dataform-workflows, etl-vs-elt, semantic-models, star-schema]
      - slug: dataops
        title: DataOps
        kind: concept
        classification: modern
        level: intermediate
        importance: medium
        mvp: false
        added_by: blueprint
        related_concepts: [ci-cd-for-data, data-observability, orchestration-observability, environment-promotion]
        note: Paraguas de prácticas; no sustituye CI/CD (11), calidad (15) ni observabilidad (16).
      - slug: finops-for-data
        title: FinOps para plataformas de datos
        kind: concept
        classification: modern
        level: advanced
        importance: high
        mvp: false
        added_by: blueprint
        related_concepts: [bigquery-cost-model, scan-reduction, bigquery-slots, gcs-storage-classes-and-lifecycle, partition-pruning]
      - slug: data-platform-engineering
        title: Plataforma de datos como producto
        kind: concept
        classification: modern
        level: advanced
        importance: high
        mvp: false
        added_by: blueprint
        related_concepts: [data-mesh, data-products, ci-cd-for-data, infrastructure-as-code]
        note: Plataforma self-serve, estándares y caminos recomendados; base de la "data platform corporativa" (§24, ejemplo 9).
      - slug: data-versioning
        title: Versionado de datos y time travel
        kind: concept
        classification: modern
        level: intermediate
        importance: medium
        mvp: false
        added_by: blueprint
        related_concepts: [open-table-formats, backfill, replay]
        note: Snapshots, time travel y clones para reproducibilidad, auditoría y recuperación.

  - slug: data-activation-and-sharing
    title: Activación, compartición y acceso a datos
    concepts:
      - slug: reverse-etl
        title: Reverse ETL
        kind: pattern
        classification: modern
        level: intermediate
        importance: medium
        mvp: false
        added_by: blueprint
        related_concepts: [etl-vs-elt]
      - slug: data-sharing
        title: Compartición de datos entre organizaciones
        kind: concept
        classification: modern
        level: intermediate
        importance: medium
        mvp: false
        added_by: blueprint
        related_concepts: [data-products, data-contracts, interoperability-standards]
        note: Mecanismos para dar acceso a datos fuera del equipo u organización; distinto de data-products, que define qué se ofrece y con qué garantías.
      - slug: semantic-layer
        title: Semantic layer
        kind: concept
        classification: modern
        level: intermediate
        importance: medium
        mvp: false
        added_by: blueprint
        related_concepts: [semantic-models]
        note: semantic-models (04) es la estructura del modelo; esta ficha es la capa de métricas gobernadas; lo que evoluciona está en emerging-semantic-layers (23).
      - slug: zero-etl-and-federation
        title: Zero-ETL y consultas federadas
        kind: concept
        classification: emerging
        level: intermediate
        importance: low
        mvp: false
        added_by: blueprint
        related_concepts: [bigquery-external-tables, change-data-capture, etl-vs-elt]
        note: Terminología de proveedores en evolución; verificar cada afirmación con documentación oficial. No reemplaza a ELT.
