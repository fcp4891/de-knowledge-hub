        title: Reverse ETL
        kind: pattern
        classification: modern
        level: intermediate
        importance: low
        mvp: false
        added_by: blueprint
        related_concepts: [etl-vs-elt]
      - slug: data-sharing
        title: Compartición de datos entre organizaciones
        kind: concept
        classification: modern
        level: intermediate
        importance: low
        mvp: false
        added_by: blueprint
        related_concepts: [data-products, data-contracts]
      - slug: semantic-layer
        title: Semantic layer
        kind: concept
        classification: modern
        level: intermediate
        importance: medium
        mvp: false
        added_by: blueprint
        related_concepts: [semantic-models]
        note: Capa de métricas compartida; su evolución reciente está en 23 (emerging-semantic-layers).
