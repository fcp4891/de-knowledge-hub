# ADR-031: textos de la disponibilidad por ficha (frontmatter availability). La UI los toma de aquí.
# available no tiene etiqueta: la ficha se publica completa. {n} y {total} los reemplaza la UI.
in_review:
  label: En revisión
  help: Contenido listo; en revisión antes de publicarse.
  count: "{n} en revisión"
in_development:
  label: En desarrollo
  help: Contenido y diseño en preparación.
  count: "{n} en desarrollo"
available:
  count: "{n} disponibles"
route_count: "{n} de {total} fichas disponibles"
back_label: Volver al itinerario
