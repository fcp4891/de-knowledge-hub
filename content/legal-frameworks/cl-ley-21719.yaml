    note: "Senado, servicio de tramitación (2026-11-22): ingreso el 2026-09-01 por mensaje. Primer trámite (Senado): el 2026-10-28, «Discusión general. Aprobado en general y particular a la vez»; el 2026-10-29, oficio de ley a la Cámara Revisora. Segundo trámite (Cámara de Diputados): el 2026-11-16, primer informe de Hacienda; el 2026-11-17, «Aprobado en general y particular sin modificaciones» y oficio de aprobación sin modificaciones a la Cámara de Origen. Finalización en la Cámara de Origen (Senado): el 2026-11-17, oficio de ley al Ejecutivo (378-26). Etapa «Trámite de aprobacion presidencial (Senado)», subetapa «Ingreso de observaciones», estado «En tramitación»; sin número de ley ni publicación en el Diario Oficial. El texto despachado (oficio 378-26) reemplaza la fecha del artículo primero transitorio por el «15 de octubre de 2027»; el mensaje proponía el «1 de diciembre de 2027»."
