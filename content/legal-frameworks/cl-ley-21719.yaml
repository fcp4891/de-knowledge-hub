  - key: postponement-bill
    label: Proyecto de postergación (boletín 18.623-07)
    value: "Despachado al Presidente de la República el 2026-11-17 (oficio 378-26), tras la aprobación del Senado (2026-10-28) y de la Cámara de Diputados sin modificaciones (2026-11-17). Fija como nueva fecha el 15 de octubre de 2027. Pendiente de promulgación y publicación: es un proyecto, no una ley; la vigencia sigue siendo el 2026-12-01."
    url: https://tramitacion.senado.cl/appsenado/templates/tramitacion/index.php?boletin_ini=18623-07
