[project]
name = "de-knowledge-hub"
version = "0.1.0"
description = "Data Engineering Knowledge Hub: modelo de conocimiento content-as-code."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Python oculta ResourceWarning por defecto; así una conexión sin cerrar aparece en el resumen.
filterwarnings = ["default::ResourceWarning"]
