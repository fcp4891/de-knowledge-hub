[project]
name = "de-knowledge-hub"
version = "0.1.0"
description = "Data Engineering Knowledge Hub: modelo de conocimiento content-as-code."
requires-python = ">=3.12"
license = "Apache-2.0"  # código; el contenido de content/ y docs/ es CC BY-NC 4.0 (LICENSE-CONTENT, NOTICE)
license-files = ["LICENSE", "LICENSE-CONTENT", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Python oculta ResourceWarning por defecto; así una conexión sin cerrar aparece en el resumen.
filterwarnings = ["default::ResourceWarning"]
