name: ci

on:
  push:
  pull_request:

# Versiones de acciones con runtime node24 (Node 20 está obsoleto en los runners).
# Imagen de Ubuntu fijada: ubuntu-latest cambiará de versión mayor sin aviso en el workflow.

jobs:
  validate-and-test:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: dekh
          POSTGRES_PASSWORD: dekh
          POSTGRES_DB: dekh
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dekh -d dekh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://dekh:dekh@localhost:54329/dekh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: make validate
      - run: make build
      - run: make test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      # El build no necesita el backend: las páginas se renderizan bajo demanda.
      API_MODE: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
